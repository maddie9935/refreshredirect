<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register for classes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="inner">
      <a class="site-name" href="index.html">Northfield University</a>
      <span class="site-section">Office of the Registrar</span>
    </div>
  </header>

  <main id="main">
    <h1>Register for classes</h1>
    <p class="lede">Your registration window is open. Enter up to three course numbers.</p>

    <form id="regForm" class="panel">
      <div class="field">
        <label for="course1">Course 1</label>
        <input type="text" id="course1" autocomplete="off">
      </div>
      <div class="field">
        <label for="course2">Course 2</label>
        <input type="text" id="course2" autocomplete="off">
      </div>
      <div class="field">
        <label for="course3">Course 3</label>
        <input type="text" id="course3" autocomplete="off">
      </div>
      <button type="submit">Submit registration</button>
      <p class="status" id="regStatus" role="status"></p>
    </form>
  </main>

  <footer>Demo page for accessibility testing. <a href="index.html">All demo pages</a></footer>
  <script>
    document.getElementById("regForm").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("regStatus").textContent = "Registration submitted. This is a demo, so nothing was saved.";
    });
  </script>
</body>
</html>
